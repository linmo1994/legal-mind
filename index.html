<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalMind（MCP）</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">LegalMind</div>
    <nav class="nav-links">
      <button type="button" id="navLoginBtn" hidden>登录</button>
      <button type="button" id="navAdminBtn" hidden>管理后台</button>
      <div id="navUserMenu" class="nav-user-menu" hidden>
        <button type="button" id="navUserBtn" class="nav-user-btn" aria-haspopup="true" aria-expanded="false">
          <span id="navUserLabel" class="nav-user-name"></span>
          <span class="nav-user-caret" aria-hidden="true">▾</span>
        </button>
        <div id="navUserDropdown" class="nav-user-dropdown" hidden role="menu">
          <button type="button" id="navLogoutBtn" role="menuitem">退出</button>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <iframe id="mainFrame" src="home.html" frameborder="0"></iframe>
  </main>
  <script src="auth.js"></script>
  <script>
    window.addEventListener('message', function(event) {
      if (event.origin && event.origin.startsWith('chrome-extension://')) {
        return;
      }
      if (event.data && event.data.type) {
        console.log('收到来自iframe的消息:', event.data);
      }
    }, false);

    function loadPage(page) {
      const sep = page.includes('?') ? '&' : '?';
      document.getElementById('mainFrame').src = page + sep + 't=' + Date.now();
      syncShellNav();
    }
    window.loadPage = loadPage;

    function canOpenAdmin() {
      if (!window.LegalMindAuth || !LegalMindAuth.getToken()) return false;
      return LegalMindAuth.hasPerm('page.admin')
        || LegalMindAuth.hasPerm('cap.user_manage')
        || LegalMindAuth.hasPerm('cap.case_manage')
        || LegalMindAuth.hasPerm('cap.role_manage');
    }

    function closeUserMenu() {
      const menu = document.getElementById('navUserMenu');
      const dropdown = document.getElementById('navUserDropdown');
      const userBtn = document.getElementById('navUserBtn');
      if (!menu || !dropdown || !userBtn) return;
      menu.classList.remove('is-open');
      dropdown.hidden = true;
      userBtn.setAttribute('aria-expanded', 'false');
    }

    function syncShellNav() {
      const loginBtn = document.getElementById('navLoginBtn');
      const adminBtn = document.getElementById('navAdminBtn');
      const userMenu = document.getElementById('navUserMenu');
      const userLabel = document.getElementById('navUserLabel');
      const loggedIn = !!(window.LegalMindAuth && LegalMindAuth.getToken());
      loginBtn.hidden = loggedIn;
      adminBtn.hidden = !canOpenAdmin();
      if (loggedIn) {
        const s = LegalMindAuth.getSession();
        const name = (s && s.user && (s.user.display_name || s.user.username)) || '已登录';
        userLabel.textContent = name;
        userMenu.hidden = false;
      } else {
        userLabel.textContent = '';
        userMenu.hidden = true;
        closeUserMenu();
      }
    }

    document.getElementById('navLoginBtn').onclick = function () {
      loadPage('login.html?next=home.html');
    };
    document.getElementById('navAdminBtn').onclick = function () {
      loadPage('admin.html');
    };
    document.getElementById('navUserBtn').onclick = function (e) {
      e.stopPropagation();
      const menu = document.getElementById('navUserMenu');
      const dropdown = document.getElementById('navUserDropdown');
      const userBtn = document.getElementById('navUserBtn');
      const open = dropdown.hidden;
      menu.classList.toggle('is-open', open);
      dropdown.hidden = !open;
      userBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    document.getElementById('navLogoutBtn').onclick = async function () {
      closeUserMenu();
      if (window.LegalMindAuth) await LegalMindAuth.logout();
      syncShellNav();
      loadPage('home.html');
    };
    document.addEventListener('click', function (e) {
      const menu = document.getElementById('navUserMenu');
      if (!menu || menu.hidden) return;
      if (!menu.contains(e.target)) closeUserMenu();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeUserMenu();
    });
    syncShellNav();
    if (window.LegalMindAuth && LegalMindAuth.getToken()) {
      LegalMindAuth.fetchMe().then(syncShellNav).catch(syncShellNav);
    }
  </script>
</body>
</html>
