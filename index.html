<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalMind（MCP）</title>
  <link rel="stylesheet" href="index.css?v=20260905accountmenu">
</head>
<body>
  <header class="navbar">
    <button type="button" class="logo" id="navLogoBtn" title="返回首页" aria-label="返回首页">LegalMind</button>
    <nav class="nav-links">
      <button type="button" id="navLoginBtn" hidden>登录</button>
      <div id="navUserMenu" class="nav-user-menu" hidden>
        <button type="button" id="navUserBtn" class="nav-user-btn" aria-haspopup="true" aria-expanded="false">
          <span id="navUserLabel" class="nav-user-name"></span>
          <span class="nav-user-caret" aria-hidden="true">▾</span>
        </button>
        <div id="navUserDropdown" class="nav-user-dropdown" hidden role="menu">
          <button type="button" id="navAdminMenuBtn" role="menuitem" hidden>管理后台</button>
          <button type="button" id="navContactBtn" role="menuitem">联系我们</button>
          <div class="nav-user-dropdown-sep" role="separator" aria-hidden="true"></div>
          <button type="button" id="navLogoutBtn" class="nav-user-logout" role="menuitem">退出</button>
        </div>
      </div>
    </nav>
  </header>
  <div id="contactModal" class="contact-modal" hidden>
    <div class="contact-modal-backdrop" data-close-contact="1"></div>
    <div class="contact-modal-panel" role="dialog" aria-modal="true" aria-labelledby="contactModalTitle">
      <div class="contact-modal-header">
        <h3 id="contactModalTitle">联系我们</h3>
        <button type="button" class="contact-modal-close" data-close-contact="1" aria-label="关闭">×</button>
      </div>
      <div class="contact-modal-body">
        <p class="contact-lead">如需产品咨询、技术支持或商务合作，欢迎通过以下方式联系 LegalMind 团队。</p>
        <dl class="contact-list">
          <div>
            <dt>电话</dt>
            <dd><a href="tel:13800008888">138-0000-8888</a></dd>
          </div>
          <div>
            <dt>邮箱</dt>
            <dd><a href="mailto:support@legalmind.cn">support@legalmind.cn</a></dd>
          </div>
          <div>
            <dt>微信</dt>
            <dd>LegalMind_Support</dd>
          </div>
          <div>
            <dt>工作时间</dt>
            <dd>工作日 09:00–18:00</dd>
          </div>
        </dl>
      </div>
      <div class="contact-modal-footer">
        <button type="button" class="contact-modal-ok" data-close-contact="1">知道了</button>
      </div>
    </div>
  </div>
  <main>
    <iframe id="mainFrame" src="home.html" frameborder="0"></iframe>
  </main>
  <script src="auth.js"></script>
  <script>
    window.addEventListener('message', function(event) {
      if (event.origin && event.origin.startsWith('chrome-extension://')) {
        return;
      }
      if (event.data && event.data.type) {
        console.log('收到来自iframe的消息:', event.data);
      }
    }, false);

    function loadPage(page) {
      const sep = page.includes('?') ? '&' : '?';
      document.getElementById('mainFrame').src = page + sep + 't=' + Date.now();
      syncShellNav();
    }
    window.loadPage = loadPage;

    function canOpenAdmin() {
      if (!window.LegalMindAuth || !LegalMindAuth.getToken()) return false;
      return LegalMindAuth.hasPerm('page.admin')
        || LegalMindAuth.hasPerm('cap.user_manage')
        || LegalMindAuth.hasPerm('cap.case_manage')
        || LegalMindAuth.hasPerm('cap.role_manage');
    }

    function closeUserMenu() {
      const menu = document.getElementById('navUserMenu');
      const dropdown = document.getElementById('navUserDropdown');
      const userBtn = document.getElementById('navUserBtn');
      if (!menu || !dropdown || !userBtn) return;
      menu.classList.remove('is-open');
      dropdown.hidden = true;
      userBtn.setAttribute('aria-expanded', 'false');
    }

    function syncShellNav() {
      const loginBtn = document.getElementById('navLoginBtn');
      const userMenu = document.getElementById('navUserMenu');
      const userLabel = document.getElementById('navUserLabel');
      const adminMenuBtn = document.getElementById('navAdminMenuBtn');
      const loggedIn = !!(window.LegalMindAuth && LegalMindAuth.getToken());
      loginBtn.hidden = loggedIn;
      if (adminMenuBtn) adminMenuBtn.hidden = !(loggedIn && canOpenAdmin());
      if (loggedIn) {
        const s = LegalMindAuth.getSession();
        const name = (s && s.user && (s.user.display_name || s.user.username)) || '已登录';
        userLabel.textContent = name;
        userMenu.hidden = false;
      } else {
        userLabel.textContent = '';
        userMenu.hidden = true;
        closeUserMenu();
      }
    }

    document.getElementById('navLogoBtn').onclick = function () {
      loadPage('home.html');
    };
    document.getElementById('navLoginBtn').onclick = function () {
      loadPage('login.html?next=home.html');
    };
    document.getElementById('navAdminMenuBtn').onclick = function (e) {
      e.stopPropagation();
      closeUserMenu();
      loadPage('admin.html');
    };
    document.getElementById('navUserBtn').onclick = function (e) {
      e.stopPropagation();
      const menu = document.getElementById('navUserMenu');
      const dropdown = document.getElementById('navUserDropdown');
      const userBtn = document.getElementById('navUserBtn');
      const open = dropdown.hidden;
      menu.classList.toggle('is-open', open);
      dropdown.hidden = !open;
      userBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    function closeContactModal() {
      const modal = document.getElementById('contactModal');
      if (modal) modal.hidden = true;
    }

    function openContactModal() {
      closeUserMenu();
      const modal = document.getElementById('contactModal');
      if (modal) modal.hidden = false;
    }

    document.getElementById('navContactBtn').onclick = function (e) {
      e.stopPropagation();
      openContactModal();
    };
    document.getElementById('navLogoutBtn').onclick = async function () {
      closeUserMenu();
      if (window.LegalMindAuth) await LegalMindAuth.logout();
      syncShellNav();
      loadPage('home.html');
    };
    document.getElementById('contactModal').addEventListener('click', function (e) {
      if (e.target && e.target.getAttribute && e.target.getAttribute('data-close-contact')) {
        closeContactModal();
      }
    });
    document.addEventListener('click', function (e) {
      const menu = document.getElementById('navUserMenu');
      if (!menu || menu.hidden) return;
      if (!menu.contains(e.target)) closeUserMenu();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeContactModal();
        closeUserMenu();
      }
    });
    syncShellNav();
    if (window.LegalMindAuth && LegalMindAuth.getToken()) {
      LegalMindAuth.fetchMe().then(syncShellNav).catch(syncShellNav);
    }
  </script>
</body>
</html>
