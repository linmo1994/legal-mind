<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>要素文书 - LegalMind</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .admin-table th, .admin-table td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; font-size: 13px; }
    .admin-table th { background: #f8fafc; }
    .form-grid label { display: block; margin: 10px 0 4px; font-size: 13px; }
    .form-grid input, .form-grid select { width: 100%; padding: 8px; box-sizing: border-box; }
    .row-actions button { margin-right: 4px; }
    .list-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 8px 0 12px; }
    .list-toolbar .btn-primary[disabled] { opacity: 0.65; cursor: not-allowed; }
    .kb-page-title {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin: 8px 0 4px; flex-wrap: wrap;
    }
    .kb-page-title h1 { margin: 0; }
    .kb-page-title .btn-primary[disabled] { opacity: 0.65; cursor: not-allowed; }
    .status-pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px;
      background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe;
    }
    .status-pill.err { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    .status-pill.warn { background: #fffbeb; color: #92400e; border-color: #fde68a; }
    .search-box { display: flex; gap: 8px; align-items: center; margin: 20px 0 8px; flex-wrap: wrap; }
    .search-box input { flex: 1; min-width: 200px; padding: 8px 10px; box-sizing: border-box; }
    .search-results { list-style: none; margin: 0; padding: 0; }
    .search-results li {
      padding: 10px 12px; margin: 0 0 8px; border: 1px solid #e5e7eb; border-radius: 8px;
      background: #f8fafc; font-size: 13px; line-height: 1.5;
    }
    .search-results .sr-meta { color: #6b7280; font-size: 12px; margin-bottom: 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
    .search-results .sr-title-link {
      background: none; border: none; padding: 0; margin: 0;
      color: #1a4a6e; cursor: pointer; font: inherit; text-align: left;
      text-decoration: underline;
    }
    .search-results .sr-title-link:disabled {
      color: #6b7280; cursor: default; text-decoration: none;
    }
    .search-results .sr-snippet { white-space: pre-wrap; word-break: break-word; color: #111827; }
  </style>
</head>
<body class="admin-body" data-admin-page="kb-templates">
  <div class="admin-wrap admin-wrap--wide">    <div id="adminSubnav"></div>
    <div class="kb-page-title">
      <h1>要素文书</h1>
      <button type="button" class="btn-primary" id="btnUpload">上传</button>
    </div>
    <div class="list-toolbar">
      <span class="muted" id="uploadStatus"></span>
      <span class="muted" id="listCount" style="margin-left:auto"></span>
    </div>

    <p id="emptyHint" class="muted" hidden>暂无要素文书模板，请上传最高院颁布的要素式法律文书模板。</p>
    <table class="admin-table" id="tplTable" style="width:100%;border-collapse:collapse;background:#fff;" hidden>
      <thead>
        <tr>
          <th>文书名称</th>
          <th>文书类型</th>
          <th>案件类型</th>
          <th>状态</th>
          <th>原文件</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tplBody"></tbody>
    </table>

    <h2 style="font-size:16px;margin:28px 0 8px">试检索</h2>
    <div class="search-box">
      <input type="search" id="searchQuery" placeholder="输入检索关键词，例如：民事起诉状 要素">
      <button type="button" class="btn-primary" id="btnSearch">检索</button>
    </div>
    <p id="searchStatus" class="muted"></p>
    <ul class="search-results" id="searchResults"></ul>
  </div>
  <script src="auth.js"></script>
  <script src="admin_nav.js"></script>
  <script src="admin_ui.js"></script>
  <script src="admin_kb_files.js"></script>
  <script>
    const UI = window.AdminUI;
    let base = "";
    let docs = [];
    let filePreview = null;
    let uploadModal = null;
    const fileNameCache = {};

    function dash(v) {
      const s = v == null ? "" : String(v).trim();
      return s ? s : "—";
    }

    function metaOf(doc) {
      return (doc && doc.meta) || {};
    }

    function tplName(doc) {
      const m = metaOf(doc);
      return dash(m.template_name || doc.title);
    }

    function validityLabel(v) {
      return (v === "失效") ? "失效" : "有效";
    }

    function setUploadStatus(text) {
      document.getElementById("uploadStatus").textContent = text || "";
    }

    async function api(path, opts) {
      const headers = LegalMindAuth.authHeaders();
      const o = Object.assign({}, opts || {});
      if (o.body && typeof o.body === "string" && !o.headers) {
        o.headers = headers;
      } else if (!o.headers) {
        o.headers = headers;
      } else {
        o.headers = Object.assign({}, headers, o.headers);
      }
      let resp;
      try {
        resp = await fetch(base + path, o);
      } catch (err) {
        throw new Error("无法连接服务（" + (base || "?") + "）。请确认 MCP 已启动，并硬刷新页面。");
      }
      const data = await resp.json().catch(function () { return {}; });
      if (resp.status === 401) { LegalMindAuth.requireLogin(); throw new Error("未登录"); }
      if (!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));
      if (data && data.jsonrpc && data.error) {
        throw new Error("知识库接口不可用（服务可能未重启）。请重启 MCP 后重试。");
      }
      return data;
    }

    async function uploadFile(file) {
      const fd = new FormData();
      fd.append("file", file);
      fd.append("description", "kb-template");
      const headers = {};
      const token = LegalMindAuth.getToken();
      if (token) headers.Authorization = "Bearer " + token;
      const resp = await fetch(base + "/api/files/upload", { method: "POST", headers: headers, body: fd });
      const data = await resp.json().catch(function () { return {}; });
      if (resp.status === 401) { LegalMindAuth.requireLogin(); throw new Error("未登录"); }
      if (!resp.ok) throw new Error(data.error || ("上传失败 " + resp.status));
      return data.file_id;
    }

    function renderList() {
      const tbody = document.getElementById("tplBody");
      const table = document.getElementById("tplTable");
      const empty = document.getElementById("emptyHint");
      document.getElementById("listCount").textContent = "共 " + docs.length + " 条";
      tbody.innerHTML = "";
      empty.hidden = docs.length > 0;
      table.hidden = docs.length === 0;
      docs.forEach(function (doc) {
        const m = metaOf(doc);
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + UI.esc(tplName(doc)) + "</td>" +
          "<td>" + UI.esc(dash(m.document_type)) + "</td>" +
          "<td>" + UI.esc(dash(m.case_category)) + "</td>" +
          "<td>" + UI.esc(validityLabel(m.validity)) + "</td>" +
          "<td>" + (doc.file_id
            ? '<button type="button" class="btn-ghost" data-act="file">' +
              UI.esc(fileNameCache[doc.file_id] || "预览") + "</button>"
            : "—") + "</td>" +
          '<td><div class="row-actions">' +
            '<button type="button" class="btn-ghost" data-act="edit">编辑</button>' +
            '<button type="button" class="btn-danger-outline" data-act="del">删除</button>' +
          "</div></td>";
        tr.querySelectorAll("[data-act]").forEach(function (btn) {
          btn.addEventListener("click", function (e) {
            e.stopPropagation();
            const act = btn.getAttribute("data-act");
            if (act === "edit") openEdit(doc);
            else if (act === "del") removeDoc(doc);
            else if (act === "file") openFile(doc);
          });
        });
        tbody.appendChild(tr);
      });
      hydrateFileNames();
    }

    async function hydrateFileNames() {
      const ids = [];
      docs.forEach(function (d) {
        if (d.file_id && !fileNameCache[d.file_id]) ids.push(d.file_id);
      });
      if (!ids.length) return;
      await Promise.all(ids.map(async function (id) {
        try {
          const info = await api("/api/files/" + encodeURIComponent(id));
          fileNameCache[id] = info.original_name || id;
        } catch (e) {
          fileNameCache[id] = id.slice(0, 8) + "…";
        }
      }));
      // refresh name labels without full rebind if still same docs
      const tbody = document.getElementById("tplBody");
      if (!tbody) return;
      docs.forEach(function (doc, idx) {
        if (!doc.file_id) return;
        const btn = tbody.rows[idx] && tbody.rows[idx].querySelector('[data-act="file"]');
        if (btn) btn.textContent = fileNameCache[doc.file_id] || "预览";
      });
    }

    async function loadList() {
      const data = await api("/api/admin/kb/documents?doc_type=template");
      docs = data.items || [];
      renderList();
    }

    function editForm(doc) {
      const m = metaOf(doc);
      const docType = m.document_type || "";
      const cat = m.case_category || "";
      const validity = validityLabel(m.validity);
      function opt(val, cur) {
        return "<option value=\"" + UI.esc(val) + "\"" + (val === cur ? " selected" : "") + ">" + UI.esc(val) + "</option>";
      }
      return '<form class="admin-form form-grid" id="tplForm">' +
        "<label>标题</label><input id=\"fTitle\" value=\"" + UI.esc(doc.title || "") + "\">" +
        "<label>文书名称</label><input id=\"fName\" value=\"" + UI.esc(m.template_name || "") + "\">" +
        "<label>文书类型</label><select id=\"fDocType\">" +
          "<option value=\"\"" + (!docType ? " selected" : "") + ">—</option>" +
          opt("起诉状", docType) + opt("答辩状", docType) + opt("申请书", docType) +
        "</select>" +
        "<label>案件类型</label><select id=\"fCat\">" +
          "<option value=\"\"" + (!cat ? " selected" : "") + ">—</option>" +
          opt("民事", cat) + opt("刑事", cat) + opt("行政", cat) +
        "</select>" +
        "<label>状态</label><select id=\"fValidity\">" +
          "<option value=\"有效\"" + (validity === "有效" ? " selected" : "") + ">有效</option>" +
          "<option value=\"失效\"" + (validity === "失效" ? " selected" : "") + ">失效</option>" +
        "</select>" +
        "</form>";
    }

    function readEditForm() {
      return {
        title: document.getElementById("fTitle").value.trim(),
        meta: {
          template_name: document.getElementById("fName").value.trim(),
          document_type: document.getElementById("fDocType").value.trim(),
          case_category: document.getElementById("fCat").value.trim(),
          validity: document.getElementById("fValidity").value.trim() || "有效"
        }
      };
    }

    function openEdit(doc) {
      UI.openDrawer({
        title: "编辑要素文书元数据",
        body: editForm(doc),
        footer: '<button type="button" class="btn-ghost" data-close="drawer">取消</button>' +
          '<button type="button" class="btn-primary" id="btnSave">保存</button>',
        onReady: function () {
          document.getElementById("btnSave").onclick = async function () {
            const payload = readEditForm();
            try {
              await api("/api/admin/kb/documents/" + encodeURIComponent(doc.id), {
                method: "PATCH",
                body: JSON.stringify(payload)
              });
              UI.toast("已保存", true);
              UI.closeDrawer();
              await loadList();
            } catch (e) {
              UI.toast(e.message, false);
            }
          };
        }
      });
    }

    function openFile(doc) {
      if (!doc.file_id) {
        UI.toast("无关联原文", false);
        return;
      }
      if (!filePreview) {
        UI.toast("预览组件未加载", false);
        return;
      }
      filePreview.open(doc.file_id, fileNameCache[doc.file_id] || doc.title).catch(function (e) {
        UI.toast(e.message || "预览失败", false);
      });
    }

    async function removeDoc(doc) {
      const ok = await UI.confirm({
        title: "删除要素文书",
        message: "确定删除「" + tplName(doc) + "」？将同步移除向量，此操作不可恢复。",
        danger: true,
        okText: "删除"
      });
      if (!ok) return;
      try {
        await api("/api/admin/kb/documents/" + encodeURIComponent(doc.id), { method: "DELETE" });
        UI.toast("已删除", true);
        await loadList();
      } catch (e) {
        UI.toast(e.message, false);
      }
    }

    async function uploadSerial(fileList, statusFn) {
      const report = typeof statusFn === "function" ? statusFn : setUploadStatus;
      const files = fileList || [];
      if (!files.length) {
        throw new Error("请先选择文件");
      }
      const btn = document.getElementById("btnUpload");
      btn.disabled = true;
      let okCount = 0;
      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const label = (i + 1) + "/" + files.length + " " + file.name;
          report("上传中 " + label);
          const fileId = await uploadFile(file);
          report("识别中 / 向量化中 " + label);
          const created = await api("/api/admin/kb/documents", {
            method: "POST",
            body: JSON.stringify({ doc_type: "template", file_id: fileId })
          });
          if (!created || !created.id) {
            throw new Error("入库响应异常，请重启 MCP 后重试");
          }
          okCount += 1;
        }
        report("完成：成功 " + okCount + "/" + files.length);
        UI.toast("已入库 " + okCount + " 个文件", true);
        await loadList();
      } catch (e) {
        report("失败（已成功 " + okCount + "/" + files.length + "）：" + e.message);
        UI.toast(e.message, false);
        try { await loadList(); } catch (_) {}
        throw e;
      } finally {
        btn.disabled = false;
      }
    }

    function openUploadModal() {
      if (!uploadModal) return;
      uploadModal.open();
    }

    async function runSearch() {
      const q = document.getElementById("searchQuery").value.trim();
      const statusEl = document.getElementById("searchStatus");
      const list = document.getElementById("searchResults");
      list.innerHTML = "";
      if (!q) {
        statusEl.textContent = "请输入检索词";
        return;
      }
      statusEl.textContent = "检索中…";
      const articleMatch = q.match(/第[一二三四五六七八九十百千零〇\d]+条/);
      const article = articleMatch ? articleMatch[0] : "";
      try {
        const data = await api("/api/admin/kb/search", {
          method: "POST",
          body: JSON.stringify({ doc_type: "template", query: q, n_results: 8 })
        });
        const results = data.results || [];
        statusEl.textContent = results.length ? ("命中 " + results.length + " 条") : "无命中";
        results.forEach(function (r) {
          const md = r.metadata || {};
          const title = md.template_name || md.document_type || md.title || r.id || "—";
          const snippet = (r.document || "").slice(0, 400);
          const fileId = md.file_id || "";
          const li = document.createElement("li");
          const meta = document.createElement("div");
          meta.className = "sr-meta";
          const titleBtn = document.createElement("button");
          titleBtn.type = "button";
          titleBtn.className = "sr-title-link";
          titleBtn.textContent = title;
          titleBtn.disabled = !fileId;
          titleBtn.onclick = function () {
            if (!fileId) {
              UI.toast("未关联源文件", false);
              return;
            }
            if (!filePreview) {
              UI.toast("预览组件未就绪", false);
              return;
            }
            filePreview.open(fileId, title, { article: article }).catch(function (e) {
              UI.toast(e && e.message ? e.message : String(e), false);
            });
          };
          meta.appendChild(titleBtn);
          if (r.distance != null) {
            const dist = document.createElement("span");
            dist.textContent = " · distance " + Number(r.distance).toFixed(3);
            meta.appendChild(dist);
          }
          const snip = document.createElement("div");
          snip.className = "sr-snippet";
          snip.textContent = snippet || "（无正文片段）";
          li.appendChild(meta);
          li.appendChild(snip);
          list.appendChild(li);
        });
      } catch (e) {
        statusEl.textContent = e.message;
        UI.toast(e.message, false);
      }
    }

    document.getElementById("btnUpload").onclick = function () { openUploadModal(); };
    document.getElementById("btnSearch").onclick = function () { runSearch(); };
    document.getElementById("searchQuery").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); runSearch(); }
    });

    (async function () {
      if (!LegalMindAuth.requireLogin()) return;
      base = await LegalMindAuth.mcpBase();
      filePreview = KbFilePreview.create({
        getBase: function () { return base; },
        api: api,
        authHeaders: function () { return LegalMindAuth.authHeaders(); },
        esc: UI.esc,
        rootId: "kbTplFileViewer"
      });
      uploadModal = KbUploadModal.create({
        rootId: "kbTplUploadModal",
        title: "添加要上传的文件",
        hint: "支持 pdf、docx、doc、txt、markdown 等最高院要素式法律文书模板；上传后将解析正文、识别元数据并向量化入库。",
        esc: UI.esc,
        onSubmit: async function (files, ctx) {
          await uploadSerial(files, function (text) {
            setUploadStatus(text);
            if (ctx && ctx.setStatus) ctx.setStatus(text);
          });
        }
      });
      try {
        await loadList();
      } catch (e) {
        document.getElementById("listCount").textContent = e.message;
        UI.toast(e.message, false);
      }
    })();
  </script>
</body>
</html>
