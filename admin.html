<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - LegalMind</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .stats-section { margin: 24px 0 8px; }
    .stats-section h2 {
      font-size: 1.05rem;
      margin: 0 0 12px;
      color: #1a4a6e;
    }
  </style>
</head>
<body class="admin-body" data-admin-page="hub">
  <div class="admin-wrap admin-wrap--wide">
    <a class="admin-back" href="home.html" onclick="if(window.parent&&window.parent.loadPage){window.parent.loadPage('home.html');return false;}">返回首页</a>
    <div id="adminSubnav"></div>
    <h1>概览</h1>
    <p class="muted">权限、案件与工具的规模一览。点击卡片可进入对应二级菜单。</p>
    <p id="statsStatus" class="muted" hidden></p>

    <section class="stats-section" aria-labelledby="rbacStatsTitle">
      <h2 id="rbacStatsTitle">权限管理</h2>
      <div class="stats-grid">
        <a class="stats-card" href="admin_users.html" data-page="admin_users.html">
          <div class="stats-label">用户</div>
          <div class="stats-value" id="statUsers">—</div>
          <div class="stats-hint">软件账号数</div>
        </a>
        <a class="stats-card" href="admin_roles.html" data-page="admin_roles.html">
          <div class="stats-label">角色</div>
          <div class="stats-value" id="statRoles">—</div>
          <div class="stats-hint">内置与自定义角色</div>
        </a>
        <a class="stats-card" href="admin_perms.html" data-page="admin_perms.html">
          <div class="stats-label">功能</div>
          <div class="stats-value" id="statPerms">—</div>
          <div class="stats-hint">页面与能力权限点</div>
        </a>
      </div>
    </section>

    <section class="stats-section" aria-labelledby="caseStatsTitle">
      <h2 id="caseStatsTitle">案件管理</h2>
      <div class="stats-grid">
        <a class="stats-card" href="admin_cases.html" data-page="admin_cases.html">
          <div class="stats-label">案件</div>
          <div class="stats-value" id="statCases">—</div>
          <div class="stats-hint">已建案件数</div>
        </a>
        <a class="stats-card" href="admin_clients.html" data-page="admin_clients.html">
          <div class="stats-label">客户</div>
          <div class="stats-value" id="statClients">—</div>
          <div class="stats-hint">委托客户数</div>
        </a>
      </div>
    </section>

    <section class="stats-section" aria-labelledby="toolsStatsTitle">
      <h2 id="toolsStatsTitle">工具管理</h2>
      <div class="stats-grid">
        <a class="stats-card" href="admin_skills.html" data-page="admin_skills.html">
          <div class="stats-label">技能</div>
          <div class="stats-value" id="statSkills">—</div>
          <div class="stats-hint">已制作的 Skill 包</div>
        </a>
        <a class="stats-card" href="admin_mcp.html" data-page="admin_mcp.html">
          <div class="stats-label">MCP</div>
          <div class="stats-value" id="statMcp">—</div>
          <div class="stats-hint" id="statMcpHint">已接入的 MCP 服务</div>
        </a>
        <a class="stats-card" href="vectorize.html" data-page="vectorize.html">
          <div class="stats-label">向量化文档</div>
          <div class="stats-value" id="statDocs">—</div>
          <div class="stats-hint" id="statDocsHint">写入向量库的文书</div>
        </a>
      </div>
    </section>
  </div>
  <script src="auth.js"></script>
  <script src="admin_nav.js"></script>
  <script>
    document.querySelectorAll('.stats-card[data-page]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        if (window.parent && window.parent.loadPage) {
          e.preventDefault();
          window.parent.loadPage(a.getAttribute('data-page'));
        }
      });
    });
    (async function loadStats() {
      if (window.LegalMindAuth && !LegalMindAuth.requireLogin()) return;
      const status = document.getElementById('statsStatus');
      try {
        const headers = (window.LegalMindAuth && LegalMindAuth.authHeaders)
          ? LegalMindAuth.authHeaders()
          : { 'Content-Type': 'application/json' };
        const cfg = await (await fetch('config.json?t=' + Date.now())).json();
        const host = (!cfg.mcp_server.host || cfg.mcp_server.host === 'localhost')
          ? '127.0.0.1' : cfg.mcp_server.host;
        const base = 'http://' + host + ':' + cfg.mcp_server.port;
        const data = await (await fetch(base + '/api/admin/stats', { headers: headers })).json();
        document.getElementById('statUsers').textContent = data.user_count != null ? data.user_count : '—';
        document.getElementById('statCases').textContent = data.case_count != null ? data.case_count : '—';
        document.getElementById('statClients').textContent = data.client_count != null ? data.client_count : '—';
        document.getElementById('statRoles').textContent = data.role_count != null ? data.role_count : '—';
        document.getElementById('statPerms').textContent = data.permission_count != null ? data.permission_count : '—';
        document.getElementById('statSkills').textContent = data.skill_count;
        document.getElementById('statMcp').textContent =
          data.mcp_service_count != null ? data.mcp_service_count : '—';
        document.getElementById('statMcpHint').textContent = '已接入的 MCP 服务';
        document.getElementById('statDocs').textContent = data.document_count;
        let docHint = '写入向量库的文书';
        if (data.chunk_count != null && data.chunk_count !== data.document_count) {
          docHint += '（分块 ' + data.chunk_count + '）';
        }
        if (data.vector_error) {
          docHint = data.vector_error;
        }
        document.getElementById('statDocsHint').textContent = docHint;
      } catch (err) {
        status.hidden = false;
        status.textContent = '无法加载统计：' + err;
        status.className = 'status-err';
      }
    })();
  </script>
</body>
</html>
