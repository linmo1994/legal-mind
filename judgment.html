<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>判决结果 - LegalMind</title>
  <link rel="stylesheet" href="judgment.css">
</head>
<body>
  <div class="container">
    <h2>判决结果</h2>
    <form class="judgment-form">
      <div class="form-group">
        <label for="caseSelect">选择案件</label>
        <select id="caseSelect" required>
          <option value="">请选择案件</option>
          <option value="case1">案号2024-001 - 张三诉李四</option>
          <option value="case2">案号2024-002 - 王五诉赵六</option>
        </select>
      </div>
      <button type="button" id="showBtn">查看判决</button>
    </form>
    <div class="result-section" id="resultSection" style="display:none;">
      <div class="result-card">
        <h3>判决结果</h3>
        <p id="judgmentText">（此处展示AI生成的判决结果）</p>
        <h4>判决理由</h4>
        <p id="reasonText">（此处展示AI生成的判决理由）</p>
        <button id="exportBtn">导出判决书</button>
      </div>
    </div>
  </div>
  <script>
    const showBtn = document.getElementById('showBtn');
    const resultSection = document.getElementById('resultSection');
    const judgmentText = document.getElementById('judgmentText');
    const reasonText = document.getElementById('reasonText');
    const exportBtn = document.getElementById('exportBtn');
    const caseSelect = document.getElementById('caseSelect');

    showBtn.onclick = function() {
      if (!caseSelect.value) {
        alert('请选择案件');
        return;
      }
      resultSection.style.display = 'block';
      judgmentText.textContent = '判决：驳回原告诉讼请求。';
      reasonText.textContent = '理由：根据证据及相关法律规定，原告主张缺乏事实和法律依据。';
    };
    exportBtn.onclick = function() {
      alert('判决书已导出（原型演示）');
    };
  </script>
</body>
</html>
