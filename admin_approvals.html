<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审批待办 - LegalMind</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .admin-table th, .admin-table td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; font-size: 14px; }
    .admin-table th { background: #f8fafc; }
    .status-pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px;
      background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe;
    }
    .row-actions { white-space: nowrap; }
    .row-actions button { margin-right: 6px; }
    .form-grid label { display: block; margin: 10px 0 4px; font-size: 13px; }
    .form-grid textarea { width: 100%; min-height: 96px; padding: 8px; box-sizing: border-box; resize: vertical; }
  </style>
</head>
<body class="admin-body" data-admin-page="approvals">
  <div class="admin-wrap admin-wrap--wide">
    <div id="adminSubnav"></div>
    <h1>审批待办</h1>
    <p class="muted">当前登录用户的待审文书。通过后将进入下一审批环节或定稿；驳回须填写意见。</p>
    <p id="status" class="muted"></p>
    <p id="emptyHint" class="muted" hidden>暂无待办。</p>
    <table class="admin-table" id="tbl" style="width:100%;margin-top:12px;border-collapse:collapse;background:#fff;" hidden>
      <thead>
        <tr>
          <th>案件号</th>
          <th>文书标题</th>
          <th>审批步骤</th>
          <th>提交时间</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="auth.js"></script>
  <script src="admin_nav.js"></script>
  <script src="admin_ui.js"></script>
  <script>
    let base = "";
    let caseMap = {};

    const STEP_LABELS = {
      lead: "主办律师审核",
      partner: "合伙人审核"
    };

    function stepLabel(step) {
      return STEP_LABELS[step] || step || "—";
    }

    function caseNoFor(task) {
      const c = caseMap[task.case_id];
      if (c && c.case_no) return c.case_no;
      if (task.case_id != null) return "案件 #" + task.case_id;
      return "—";
    }

    function formatTime(value) {
      if (!value) return "—";
      const d = new Date(value);
      if (isNaN(d.getTime())) return value;
      return d.toLocaleString("zh-CN", { hour12: false });
    }

    async function api(path, opts) {
      const resp = await fetch(base + path, Object.assign({ headers: LegalMindAuth.authHeaders() }, opts || {}));
      const data = await resp.json().catch(function () { return {}; });
      if (resp.status === 401) { LegalMindAuth.requireLogin(); throw new Error("未登录"); }
      if (!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));
      return data;
    }

    async function loadCaseMap() {
      try {
        const data = await api("/api/admin/cases?mine=1");
        caseMap = {};
        (data.cases || []).forEach(function (c) {
          caseMap[c.id] = c;
        });
      } catch (e) {
        caseMap = {};
      }
    }

    async function decideTask(task, decision, comment) {
      await api("/api/approvals/" + encodeURIComponent(task.id) + "/decide", {
        method: "POST",
        body: JSON.stringify({ decision: decision, comment: comment || "" })
      });
    }

    async function approveTask(task) {
      const ok = await AdminUI.confirmAction({
        title: "通过审批",
        message: "确认通过「" + (task.artifact_title || "文书") + "」？"
      });
      if (!ok) return;
      try {
        await decideTask(task, "approve");
        AdminUI.toast("已通过", true);
        await load();
      } catch (e) {
        AdminUI.toast(e.message, false);
      }
    }

    function rejectTask(task) {
      AdminUI.openDrawer({
        title: "驳回审批",
        body: '<div class="form-grid">' +
          '<p class="muted">文书：' + AdminUI.esc(task.artifact_title || "—") + "</p>" +
          '<label class="req">驳回意见</label>' +
          '<textarea id="rejectComment" placeholder="请说明驳回原因，便于起草人修改"></textarea>' +
          "</div>",
        footer: '<button type="button" class="btn-ghost" data-close="drawer">取消</button>' +
          '<button type="button" class="btn-danger-outline" id="rejectSave">确认驳回</button>',
        onReady: function () {
          document.getElementById("rejectSave").onclick = async function () {
            const comment = document.getElementById("rejectComment").value.trim();
            if (!comment) {
              AdminUI.toast("请填写驳回意见", false);
              return;
            }
            try {
              await decideTask(task, "reject", comment);
              AdminUI.closeDrawer();
              AdminUI.toast("已驳回", true);
              await load();
            } catch (e) {
              AdminUI.toast(e.message, false);
            }
          };
        }
      });
    }

    async function load() {
      const data = await api("/api/approvals/inbox");
      const tasks = data.tasks || [];
      const tb = document.querySelector("#tbl tbody");
      const tbl = document.getElementById("tbl");
      const empty = document.getElementById("emptyHint");
      tb.innerHTML = "";

      if (!tasks.length) {
        tbl.hidden = true;
        empty.hidden = false;
        return;
      }

      tbl.hidden = false;
      empty.hidden = true;

      tasks.forEach(function (task) {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + AdminUI.esc(caseNoFor(task)) + "</td>" +
          "<td>" + AdminUI.esc(task.artifact_title || "—") + "</td>" +
          '<td><span class="status-pill">' + AdminUI.esc(stepLabel(task.step)) + "</span></td>" +
          "<td>" + AdminUI.esc(formatTime(task.created_at)) + "</td>" +
          "<td class='row-actions'></td>";

        const actions = tr.lastChild;
        const approveBtn = document.createElement("button");
        approveBtn.type = "button";
        approveBtn.className = "btn-primary";
        approveBtn.textContent = "通过";
        approveBtn.onclick = function () { approveTask(task); };
        actions.appendChild(approveBtn);

        const rejectBtn = document.createElement("button");
        rejectBtn.type = "button";
        rejectBtn.className = "btn-danger-outline";
        rejectBtn.textContent = "驳回";
        rejectBtn.onclick = function () { rejectTask(task); };
        actions.appendChild(rejectBtn);

        tb.appendChild(tr);
      });
    }

    (async function () {
      if (!LegalMindAuth.requireLogin()) return;
      if (window.LegalMindAuth &&
          !LegalMindAuth.hasPerm("page.admin.approvals") &&
          !LegalMindAuth.hasPerm("page.admin")) {
        document.getElementById("status").textContent = "无权访问审批待办";
        document.getElementById("status").className = "status-err";
        return;
      }
      base = await LegalMindAuth.mcpBase();
      try {
        await loadCaseMap();
        await load();
      } catch (e) {
        document.getElementById("status").textContent = e.message;
        document.getElementById("status").className = "status-err";
      }
    })();
  </script>
</body>
</html>
