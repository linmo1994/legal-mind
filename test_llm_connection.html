<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>LLM连接测试</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    .test-item { background: white; padding: 15px; margin: 10px 0; border-radius: 5px; }
    .success { border-left: 4px solid #4caf50; }
    .error { border-left: 4px solid #f44336; }
    .loading { border-left: 4px solid #ff9800; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    pre { background: #f0f0f0; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>🔍 LLM连接诊断工具</h1>
  
  <button onclick="runAllTests()">运行所有测试</button>
  <button onclick="testConfig()">测试配置加载</button>
  <button onclick="testMCP()">测试MCP服务端</button>
  <button onclick="testLLM()">测试LLM API</button>
  
  <div id="results"></div>

  <script>
    const CONFIG = {
      mcpServerUrl: 'http://localhost:8000',
      llmApiUrl: 'https://api.deepseek.com/v1/chat/completions',
      llmApiKey: 'your-api-key-here',
      llmModel: 'deepseek-chat'
    };

    function addResult(title, status, content) {
      const div = document.createElement('div');
      div.className = `test-item ${status}`;
      div.innerHTML = `
        <h3>${status === 'success' ? '✅' : status === 'error' ? '❌' : '⏳'} ${title}</h3>
        <pre>${content}</pre>
      `;
      document.getElementById('results').appendChild(div);
    }

    async function testConfig() {
      addResult('测试配置加载', 'loading', '加载中...');
      try {
        const response = await fetch('config.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        addResult('配置加载', 'success', JSON.stringify(data, null, 2));
      } catch (e) {
        addResult('配置加载', 'error', e.message);
      }
    }

    async function testMCP() {
      addResult('测试MCP服务端', 'loading', '测试中...');
      try {
        const res = await fetch('http://localhost:8000/health');
        const data = await res.json();
        addResult('MCP服务端', res.ok ? 'success' : 'error', JSON.stringify(data, null, 2));
      } catch (e) {
        addResult('MCP服务端', 'error', e.message);
      }
    }

    async function testLLM() {
      addResult('测试LLM API', 'loading', '测试中...');
      try {
        const response = await fetch('http://localhost:8000/api/llm/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [{ role: 'user', content: '你好，请回复"连接成功"' }],
            max_tokens: 20
          })
        });
        
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(`HTTP ${response.status}: ${JSON.stringify(error)}`);
        }
        
        const data = await response.json();
        if (data.choices && data.choices[0]) {
          addResult('LLM API', 'success', 
            `响应: ${data.choices[0].message.content}\n\n完整响应:\n${JSON.stringify(data, null, 2)}`
          );
        } else {
          addResult('LLM API', 'error', '响应格式错误: ' + JSON.stringify(data, null, 2));
        }
      } catch (e) {
        addResult('LLM API', 'error', e.message);
      }
    }

    async function runAllTests() {
      document.getElementById('results').innerHTML = '';
      await testConfig();
      await testMCP();
      await testLLM();
    }

    // 页面加载时自动运行测试
    window.addEventListener('load', () => {
      console.log('自动运行连接测试...');
      runAllTests();
    });
  </script>
</body>
</html>
