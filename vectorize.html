<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档向量化 - LegalMind</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="vectorize.css">
</head>
<body class="admin-body" data-admin-page="vectorize">
  <div class="admin-wrap admin-wrap--wide">
    <a class="admin-back" href="home.html" onclick="if(window.parent&&window.parent.loadPage){window.parent.loadPage('home.html');return false;}">返回首页</a>
    <div id="adminSubnav"></div>
    <h1>文档向量化</h1>
    <p class="muted">将法律文书写入向量库，供法规与类案检索使用。</p>

    <div class="vz-section">
      <h2>向量数据库信息</h2>
      <button type="button" class="btn btn-secondary" onclick="loadDbInfo()">刷新信息</button>
      <div id="dbInfo" class="db-info"></div>
    </div>

    <div class="vz-section">
      <h2>写入文档</h2>
      <div class="vz-form-group">
        <label for="documentId">文档编号（唯一标识）</label>
        <input type="text" id="documentId" placeholder="例如: doc_20241224_001">
      </div>
      <div class="vz-form-group">
        <label for="documentTitle">文档标题（可选）</label>
        <input type="text" id="documentTitle" placeholder="例如: 劳动合同模板">
      </div>
      <div class="vz-form-group">
        <label for="documentText">文档正文</label>
        <textarea id="documentText" placeholder="在此输入或粘贴文书内容…"></textarea>
      </div>
      <button type="button" class="btn btn-primary" onclick="vectorizeDocument()" id="vectorizeBtn">开始向量化</button>
      <div id="vectorizeStatus"></div>
    </div>

    <div class="vz-section">
      <h2>检索相似内容</h2>
      <div class="vz-form-group">
        <label for="searchQuery">检索内容</label>
        <input type="text" id="searchQuery" placeholder="输入要检索的要点或条文…">
      </div>
      <div class="vz-form-group">
        <label for="searchResultsCount">返回条数</label>
        <input type="number" id="searchResultsCount" class="vz-input-narrow" value="10" min="1" max="50">
      </div>
      <button type="button" class="btn btn-primary" onclick="searchDocuments()" id="searchBtn">检索</button>
      <div id="searchStatus"></div>
      <div id="searchResultsArea" class="result-area"></div>
    </div>

    <div class="vz-section">
      <h2>删除文档</h2>
      <div class="vz-form-group">
        <label for="deleteDocumentId">文档编号</label>
        <input type="text" id="deleteDocumentId" placeholder="输入要删除的文档编号">
      </div>
      <button type="button" class="btn btn-danger" onclick="deleteDocument()" id="deleteBtn">删除文档</button>
      <div id="deleteStatus"></div>
    </div>
  </div>
  <script src="auth.js"></script>
  <script src="admin_nav.js"></script>
  <script>
    let MCP_SERVER_URL = null;
    let requestIdCounter = 0;

    function normalizeMcpHost(host) {
      // macOS 上 localhost 可能走 IPv6 (::1)，而服务端只监听 IPv4，会表现为 Failed to fetch
      if (!host || host === 'localhost') {
        return '127.0.0.1';
      }
      return host;
    }

    async function getMcpServerUrl() {
      if (MCP_SERVER_URL) {
        return MCP_SERVER_URL;
      }
      const response = await fetch('config.json?t=' + Date.now());
      if (!response.ok) {
        throw new Error(`加载配置失败: HTTP ${response.status}`);
      }
      const configData = await response.json();
      const host = normalizeMcpHost((configData.mcp_server && configData.mcp_server.host) || 'localhost');
      const port = (configData.mcp_server && configData.mcp_server.port) || 8001;
      MCP_SERVER_URL = `http://${host}:${port}`;
      console.log('[vectorize] MCP URL:', MCP_SERVER_URL);
      return MCP_SERVER_URL;
    }

    // 生成请求ID
    function generateRequestId() {
      return ++requestIdCounter;
    }

    // 发送MCP请求
    async function sendMCPRequest(method, params = {}) {
      const request = {
        jsonrpc: '2.0',
        id: generateRequestId(),
        method: method,
        params: params
      };

      const url = await getMcpServerUrl();
      let response;
      try {
        response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(request)
        });
      } catch (error) {
        throw new Error(`无法连接 MCP 服务 ${url}（${error.message}）。请确认服务已启动且端口与 config.json 一致`);
      }

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }

      const data = await response.json();
      
      if (data.error) {
        throw new Error(data.error.message || '请求失败');
      }

      return data.result;
    }

    // 调用工具
    async function callTool(toolName, arguments_) {
      const result = await sendMCPRequest('tools/call', {
        name: toolName,
        arguments: arguments_
      });

      // 解析工具返回的内容
      if (result.content && result.content[0]) {
        return JSON.parse(result.content[0].text);
      }
      return result;
    }

    // HTML转义函数，防止XSS攻击
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 加载数据库信息
    async function loadDbInfo() {
      const dbInfoDiv = document.getElementById('dbInfo');
      dbInfoDiv.innerHTML = '<div class="loading"></div> 加载中...';

      try {
        const info = await callTool('get_vector_db_info');
        dbInfoDiv.innerHTML = `
          <div class="info-card">
            <h3>集合名称</h3>
            <div class="value">${info.collection_name || 'N/A'}</div>
          </div>
          <div class="info-card">
            <h3>文档数量</h3>
            <div class="value">${info.document_count || 0}</div>
          </div>
          <div class="info-card">
            <h3>存储路径</h3>
            <div class="value value-sm">${info.persist_directory || 'N/A'}</div>
          </div>
        `;
      } catch (error) {
        dbInfoDiv.innerHTML = `<div class="status error">错误: ${error.message}</div>`;
      }
    }

    // 向量化文档
    async function vectorizeDocument() {
      const btn = document.getElementById('vectorizeBtn');
      const statusDiv = document.getElementById('vectorizeStatus');
      const documentId = document.getElementById('documentId').value.trim();
      const documentTitle = document.getElementById('documentTitle').value.trim();
      const documentText = document.getElementById('documentText').value.trim();

      if (!documentId) {
        statusDiv.innerHTML = '<div class="status error">请输入文档ID</div>';
        return;
      }

      if (!documentText) {
        statusDiv.innerHTML = '<div class="status error">请输入文档内容</div>';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> 向量化中...';
      statusDiv.innerHTML = '<div class="status info">正在向量化文档，请稍候...</div>';

      try {
        const metadata = {};
        if (documentTitle) {
          metadata.title = documentTitle;
        }

        const result = await callTool('vectorize_document', {
          document_id: documentId,
          text: documentText,
          metadata: metadata
        });

        if (result.success) {
          statusDiv.innerHTML = `<div class="status success">✅ ${result.message}</div>`;
          // 清空输入
          document.getElementById('documentText').value = '';
          document.getElementById('documentId').value = '';
          document.getElementById('documentTitle').value = '';
          // 刷新数据库信息
          loadDbInfo();
        } else {
          statusDiv.innerHTML = `<div class="status error">❌ ${result.error || '向量化失败'}</div>`;
        }
      } catch (error) {
        statusDiv.innerHTML = `<div class="status error">❌ 错误: ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '开始向量化';
      }
    }

    // 搜索文档
    async function searchDocuments() {
      const btn = document.getElementById('searchBtn');
      const statusDiv = document.getElementById('searchStatus');
      const resultsDiv = document.getElementById('searchResultsArea');
      const query = document.getElementById('searchQuery').value.trim();
      const nResults = parseInt(document.getElementById('searchResultsCount').value) || 5;

      if (!query) {
        statusDiv.innerHTML = '<div class="status error">请输入检索内容</div>';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> 检索中...';
      statusDiv.innerHTML = '<div class="status info">正在检索...</div>';
      resultsDiv.innerHTML = '';

      try {
        const results = await callTool('search_documents', {
          query: query,
          n_results: nResults
        });

        if (results.length === 0) {
          resultsDiv.innerHTML = '<div class="status info">未找到相似文档</div>';
        } else {
          // 按文档分组展示结果
          const groupedByDocument = {};
          
          results.forEach((result, index) => {
            const documentId = result.metadata?.document_id || 'unknown';
            const documentTitle = result.metadata?.title || documentId;
            
            if (!groupedByDocument[documentId]) {
              groupedByDocument[documentId] = {
                title: documentTitle,
                documentId: documentId,
                chunks: []
              };
            }
            
            // ChromaDB可能返回不同类型的距离：
            // 1. 余弦距离：范围0-2，distance = 1 - cosine_similarity
            // 2. L2距离（欧氏距离）：范围0-无穷大，距离越小越相似
            // 3. 内积距离：可能为负值
            // 需要根据实际distance值来判断和转换
            let similarity;
            if (result.distance !== null && result.distance !== undefined) {
              const distance = result.distance;

              // ChromaDB默认使用L2距离（欧氏距离），向量已归一化
              // 对于归一化向量的L2距离，范围是0-2
              // L2_distance^2 = 2 - 2*cosine_similarity
              // cosine_similarity = 1 - (L2_distance^2 / 2)
              if (distance < 0) {
                // 负值距离，可能是内积距离或其他度量
                console.warn('检测到负值distance:', distance, '，使用备用计算方式');
                similarity = '0.0%'; // 负值距离表示不相关，设为0%
              } else if (distance <= 2) {
                // 归一化向量的L2距离（ChromaDB默认），转换为余弦相似度
                // 公式：cosine_similarity = 1 - (L2_distance^2 / 2)
                const cosineSimilarity = 1 - (distance * distance / 2);
                // 归一化到0-1范围：(cosine_similarity + 1) / 2
                // cosine_similarity范围是-1到1，归一化后是0到1
                const normalizedSimilarity = Math.max(0, (cosineSimilarity + 1) / 2);
                similarity = (normalizedSimilarity * 100).toFixed(1) + '%';
              } else {
                // 向量未归一化，L2距离很大（>2），使用反比例函数
                const maxDistance = 10; // 假设最大有效距离为10
                const normalizedDistance = Math.min(distance / maxDistance, 1);
                const normalizedSimilarity = 1 - normalizedDistance;
                similarity = (Math.max(0, normalizedSimilarity) * 100).toFixed(1) + '%';
              }
            } else {
              similarity = 'N/A';
            }
            
            groupedByDocument[documentId].chunks.push({
              index: index + 1,
              similarity: similarity,
              chunkIndex: result.metadata?.chunk_index !== undefined ? result.metadata.chunk_index : 'N/A',
              totalChunks: result.metadata?.total_chunks !== undefined ? result.metadata.total_chunks : 'N/A',
              chunkId: result.id || 'N/A',
              content: result.document,
              distance: result.distance
            });
          });
          
          // 按相似度排序文档（取每个文档最高相似度的片段）
          // 注意：similarity是字符串格式（如"85.5%"），需要解析为数字
          const documentList = Object.values(groupedByDocument).map(doc => ({
            ...doc,
            maxSimilarity: Math.max(...doc.chunks.map(c => {
              const simStr = c.similarity;
              if (simStr === 'N/A') return 0;
              // 去掉百分号并解析为数字
              const simNum = parseFloat(simStr.replace('%', '')) || 0;
              return simNum;
            }))
          })).sort((a, b) => b.maxSimilarity - a.maxSimilarity);
          
          // 生成HTML
          let html = '<div class="search-results-list">';
          html += `<div class="results-summary">找到 ${results.length} 个内容片段，来自 ${documentList.length} 个文档</div>`;
          
          documentList.forEach((doc, docIndex) => {
            // 文档标题区域
            html += `
              <div class="document-group">
                <div class="document-header">
                  <h3 class="document-title">${escapeHtml(doc.title)}</h3>
                  <span class="document-chunks-count">${doc.chunks.length} 个相关片段</span>
                </div>
                <div class="document-meta">
                  <span class="meta-item">文档编号：<strong>${escapeHtml(doc.documentId)}</strong></span>
                </div>
                
                <div class="chunks-list">
            `;
            
            // 按相似度排序该文档的片段
            // 注意：similarity是字符串格式（如"85.5%"），需要解析为数字
            doc.chunks.sort((a, b) => {
              const simA = a.similarity === 'N/A' ? 0 : parseFloat(a.similarity.replace('%', '')) || 0;
              const simB = b.similarity === 'N/A' ? 0 : parseFloat(b.similarity.replace('%', '')) || 0;
              return simB - simA; // 降序排列（相似度高的在前）
            });
            
            // 展示该文档的所有内容片段
            doc.chunks.forEach((chunk, chunkIndex) => {
              html += `
                <div class="chunk-item">
                  <div class="chunk-header">
                    <span class="chunk-number">片段 ${chunkIndex + 1}</span>
                    <span class="similarity-badge">相似度: ${chunk.similarity}</span>
                  </div>
                  <div class="chunk-meta">
                    <span class="meta-item">位置：第 ${chunk.chunkIndex + 1}/${chunk.totalChunks} 块</span>
                    <span class="meta-item">块编号：${escapeHtml(chunk.chunkId)}</span>
                  </div>
                  <div class="chunk-content">
                    <div class="content-text">${escapeHtml(chunk.content)}</div>
                  </div>
                </div>
              `;
            });
            
            html += `
                </div>
              </div>
            `;
          });
          
          html += '</div>';
          resultsDiv.innerHTML = html;
        }
        statusDiv.innerHTML = `<div class="status success">✅ 找到 ${results.length} 个相似文档</div>`;
      } catch (error) {
        statusDiv.innerHTML = `<div class="status error">❌ 错误: ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '检索';
      }
    }

    // 删除文档
    async function deleteDocument() {
      const btn = document.getElementById('deleteBtn');
      const statusDiv = document.getElementById('deleteStatus');
      const documentId = document.getElementById('deleteDocumentId').value.trim();

      if (!documentId) {
        statusDiv.innerHTML = '<div class="status error">请输入文档ID</div>';
        return;
      }

      if (!confirm(`确定要删除文档 "${documentId}" 吗？`)) {
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> 删除中...';
      statusDiv.innerHTML = '<div class="status info">正在删除...</div>';

      try {
        const result = await callTool('delete_document', {
          document_id: documentId
        });

        if (result.success) {
          statusDiv.innerHTML = `<div class="status success">✅ ${result.message}</div>`;
          document.getElementById('deleteDocumentId').value = '';
          // 刷新数据库信息
          loadDbInfo();
        } else {
          statusDiv.innerHTML = `<div class="status error">❌ ${result.message || '删除失败'}</div>`;
        }
      } catch (error) {
        statusDiv.innerHTML = `<div class="status error">❌ 错误: ${error.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '删除文档';
      }
    }


    // 页面加载时获取数据库信息
    window.addEventListener('load', () => {
      loadDbInfo();
    });
  </script>
</body>
</html>
